<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>JS Bin</title>
  
  
  <style>
    
    #gaugediv {
      width: 300px;
      position: relative;
      display: block;
      margin: auto;
      margin-top: 5px;
      
    }
    body {
    width: 60%;
      text-align: center;
      
      
      
    }
    #gauge {
      width: 100%;
      height: auto;
      
      object-fit: contain;
    }
    
    #needle {
  width: 60%;
  position: absolute;
  top: 43.75%;
  left: 1.75%;
  transform-origin: 80.5% 50%;
    }
 
    p,
label {
  font:
    1rem "Fira Sans",
    sans-serif;
}

input {
  margin: 0.4rem;
}
    #debugWhole {
      
      display: flex;
      border: 5px solid darkgrey;
      width: 100%;
      opacity: 0;
      height: auto;
      user-select: none;
      
      
    }    
    #debug{
      background-color: grey;
      width: 40%;
      font-size: 12px;
      opacity: 1;
    }
    
    #debug2 {
      background-color: grey;
      width: 40%;
      font-size: 12px;
      opacity: 1;
    }
    
    
    
    #sysInput, #diaInput {
      height: 20px;
      width: 40px;
    }
    
    #pumpButton, #submit, #tryAgain {
  background-color: grey;
  border: 2px solid g;
  color: white;
  font-style: bold;
  padding: 2px 4px;
  text-align: center;
  text-decoration: ;
  display: inline-block;
  font-size: 16px;
  cursor: pointer;
  border-radius: 4px;
      
}
    
    #pumpButton:hover {
      box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
    } 
    
    
    #results {
      opacity: 0;
      border: 5px solid black;
      background-color: grey;
      
      
    }
    
    
    
    
    #everything {
      
      margin-bottom: -100px;
      height: 100%
        width: auto;
      white-space: nowrap;
      max-height: 800px;
      min-width: 500px;
      
    }
    
 
  </style>
</head>
<body>
  <div id="everything">
  
  
<div id="gaugediv">
  
  <img id="gauge" src="https://i.postimg.cc/NjpPtFsm/gauge2.png" alt="gauge1" border="0">
  
  <img id="needle" src="https://i.ibb.co/TyqB9Cb/needle1.png" alt="needle1" border="0">
  </div>
  
    
  <button type="button" id="pumpButton" onClick="pump()">Pump Big</button>
    <button type="button" id="pumpButton" onClick="pumpSmall()">Pump Small</button>
<br>
    <button type="button" id="pumpButton" onClick="muteAudio()">Mute</button>
  
  
  
  <label class="switch">
  <input id="check" type="checkbox">
  <span class="slider">Background noise</span>
    
    
</label>
  
  <br>
    <button type="button" id="pumpButton" onClick="toggleDebug()">Toggle debug panel</button>


  
  
  
  

<div>
  <input type="range" id="bleed" name="volume" min="0" max="80" />
  <label for="bleed">Bleed</label>
</div>
  
  
  <br>
  Systolic Pressure:<input autocomplete="off" id="sysInput" maxlength="3">mmHg
  <br>
  Diastolic Pressure:<input autocomplete="off" id="diaInput" maxlength="3">mmHg
  <br>
  <small id="incorrectError" style="color: red; opacity: 0;">Please enter a valid systolic and diastolic pressure</small>

<br>
    <button type="button" id="submit" onClick="submit()">Submit</button>
    <br>
    <button type="button" id="tryAgain" onClick="tryAgain()">Try Again</button>
<br>
  <br>
<div id="results">
  
   <h1 class="center-text">
     You entered: <span id="sysGuessText">foo</span>/<span id="diaGuessText">foo</span>
     <br>
     The patients bp was: <span id="sysGuessReal">foo</span>/<span id="diaGuessReal">foo</span>
     <br>
     Your final score is: <span id="score">foo</span>/<span id="roundsTotal">foo</span>

    </h1>
  </div>
  
  
<div id="debugWhole">
<div id="debug">
    <button type="button" onClick="bounce()">bounce</button>

     <h3 class="center-text">bleed value: <span id="counter">0</span></h3>
     <h3 class="center-text">angle value: <span id="angleval">0</span></h3>
     <h3 class="center-text">speed value: <span id="speed">0</span></h3>
       <h1 class="center-text">bp value: <span id="bp">0</span></h1>
     <h1 class="center-text">heartrate: <span id="hb">0</span></h1>
  
  </div>

<div id="debug2">
<br>
         <h1 class="center-text">in range? <span id="range">0</span></h1>
         <h1 class="center-text">systolic: <span id="sys">0</span></h1>
         <h1 class="center-text">diastolic: <span id="dia">0</span></h1>


  </div>
  </div>
  </div>
  
  
  
  <script>
    
    
    /*
    
    -65 TO 251
    */
    let angle = -65;
    let direction = -0.2;
    let speed = 0;
    let pumping = -1;
    let bpvalue = 0;
    let hb = getRandomIntInclusive(40, 140);
    let range = false;
         let beatInterval = null;
    let score = 0;
    let rounds = 0;
    let sys = getRandomIntInclusive(80, 240);
    
    
    let dia = sys - getRandomIntInclusive(30, 50);
    
    
    let mute = false;
    
    if(oddOrEven(sys) == "odd")
      sys += 1;
    
    if(oddOrEven(dia) == "odd")
      dia += 1;

    const background = new Audio('https://od.lk/s/MzJfNDcwODYzMDBf/newbackground.mp3');
    
    const beat = new Audio('https://audio.jukehost.co.uk/IpMGljaqMTU3RUR04RsjrozhHT7GxAYa'); 

    document.getElementById("tryAgain").style.display = "none";
    
 const roomtone = new Audio('https://od.lk/s/MzJfNDcwODYxNjBf/roomtone5.mp3'); 

    sys = Math.round( sys );
    dia = Math.round( dia );

    
            document.getElementById("sys").textContent = sys;
            document.getElementById("dia").textContent = dia;

    
    function angleToPressure(angle) {
    speedText = "foo";
    pressureText = "foo";
      

      const angleAt20 = -65.32;
      const angleAt302 = 249;
      
      const pressure = ((angle - angleAt20) / (angleAt302 - angleAt20)) * (302 - 20) + 20;
      
      pressureText = pressure.toString();
      pressureText = pressureText.substring(0,5);
            document.getElementById("bp").textContent = pressureText;

}


    function animate() {

      
      if(check.checked == true)
        background.play().catch(error => {
            });
      
      if(check.checked == false)
        background.pause();
      
      if(mute == false)
      roomtone.play().catch(error => {
            });
      
       var pressure = angleToPressure(angle);
      var pressure2 = pressure;
      var intvalue = Math.round( angle );
      speedText = speed.toString();
      speedText = speedText.substring(0,4);
      
      
      if(bleed.value == 0 && pumping == -1)
        speed = 0;
      
      
      if(bleed.value > 0 && pumping == -1)
        {
          speed = bleed.value / 30;
        } 
      if(bleed.value > 70 && pumping == -1)
        speed = 10;
      
      
      
      angle += direction * speed;
      if(angle >= 251) direction = 0;
      if(angle <= -65) direction = 0;
      
            if(angle > 250) angle = 249;

      
      document.getElementById("needle").style.transform =
        `rotate(${angle}deg)`;
      
      
      //-65 - 249 | 314 
      // 20 - 302 | 324
      
      

      
      document.getElementById("counter").textContent = bleed.value; 
          document.getElementById("angleval").textContent = intvalue;
          document.getElementById("speed").textContent = speedText;
          document.getElementById("hb").textContent = hb;
      
      document.getElementById("range").textContent = range;

      
                requestAnimationFrame(animate);
      
      pressureInt = parseFloat(pressureText);
      
      
      
          if(pressureInt < sys && pressureInt > dia) {
      range = true;
            
            
            
    if(!beatInterval) {
      beatInterval = setInterval(() => {
        bounce();
      }, 900 - (hb * 2));
    }
            
    } else {
      range = false;
      
      if(beatInterval) {
        clearInterval(beatInterval);
        beatInterval = null;
      }
    }
      
      
      
      
      
      if(tryAgain.disabled == true)
          document.getElementById("results").style.opacity = "0";

      
      
      
      
    }
      

          requestAnimationFrame(animate);

    

    
    
    
    
    function pump() {
       speed = 2;
      direction = 2;
      pumping = 1;
      
      if(angle > 250) angle = 249;
      
        setTimeout(() => {
          speed = bleed.value / 30; 
          direction = -0.2;
          pumping = -1;
          }, 300);      
    }
    
    function pumpSmall() {
       speed = 1;
      direction = 2;
      pumping = 1;
      
      if(angle > 250) angle = 249;
      
        setTimeout(() => {
          speed = bleed.value / 30; 
          direction = -0.2;
          pumping = -1;
          }, 300);      
    }
    
    
    
    
    
    
    function bounce() {
      console.log("bounce");
      
      
      
      
      if(mute == false) {


            beat.play().catch(error => {
                console.error("Audio play failed:", error);
            });
       
      
      
      }
      
      
      
      if(bleed.value > 75) {
      speed = 0.7;
      direction = 2;
      pumping = 1;
      } else if(bleed.value > 30 && bleed.value < 75) {
      speed = 0.5;
      direction = 2;
      pumping = 1 
      } else {
      speed = 0.1
      direction = 2;
      pumping = 1;
      }
      
      
      
        
      if(angle > 250) angle = 249;
      
        setTimeout(() => {
          speed = bleed.value / 30; 
          direction = -0.2;
          pumping = -1;
          }, (50));      
      
      
    }
    
    
    
    
    
    function toggleDebug() {
      
const debug = document.getElementById('debugWhole'); 

const computedStyle = window.getComputedStyle(debugWhole);

const opacity = computedStyle.getPropertyValue('opacity');

console.log(`debug opacity:  ${opacity}`); 
    
    
      
      if(debug.style.opacity == 1)
  debug.style.opacity = 0;
      else if(debug.style.opacity == 0)
  debug.style.opacity = 1;
    
    }
   
  
    
    
    function getRandomIntInclusive(min, max) {
  min = Math.ceil(min);
  max = Math.floor(max);
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

const randomNumber = getRandomIntInclusive(40, 140);
    
    
    
    
    
    function submit() {
      
      var sysGuess = sysInput.value;
      var diaGuess = diaInput.value;
      
      
      if(sysGuess && diaGuess) {
      sysDiff = Math.abs( sysGuess - sys);
      diaDiff = Math.abs( diaGuess - dia);
      
      
      document.getElementById("sysGuessText").textContent = sysGuess;
      document.getElementById("diaGuessText").textContent = diaGuess;
      
      
      document.getElementById("sysGuessReal").textContent = sys;
      document.getElementById("diaGuessReal").textContent = dia;

        fadeInResults();
      
        
        
        
         if(sysDiff < 4)
           {
              score += 5;
             rounds += 1;
           } else if(sysDiff < 6) {
             score += 4;
             rounds += 1;
           } else if(sysDiff < 8) {
             score += 3;
             rounds += 1;
           } else if(sysDiff < 10) {
             score += 2;
             rounds += 1;
           } else if(sysDiff < 12) {
             score += 1;
             rounds += 1;
           } else {
             score += 0;
             rounds += 1;
           }
        
        if(diaDiff < 4)
           {
              score += 5;
             rounds += 1;
           } else if(diaDiff < 6) {
             score += 4;
             rounds += 1;
           } else if(diaDiff < 8) {
             score += 3;
             rounds += 1;
           } else if(diaDiff < 10) {
             score += 2;
             rounds += 1;
           } else if(diaDiff < 12) {
             score += 1;
             rounds += 1;
           } else {
             score += 0;
             rounds += 1;
           }
        
    document.getElementById("tryAgain").style.display = "inline";
        
        setTimeout(() => {
        
               tryAgain.disabled = false;    
        
      }, 500);

      } else {

        
        fadeOutError();
      }
                       document.getElementById("score").textContent = score;
                       document.getElementById("roundsTotal").textContent = (rounds * 5);
      
      
      
               


    }
    
    
    function fadeOutError() {

      setTimeout(() => {
      for (let i = 0; i <= 10; i++) {
      setTimeout(() => {
        
        incorrectError.style.opacity = 1 - (i * 0.1);
        
      }, 200 * i);
      }
      }, 1000);
     }
    
    
    function fadeInResults() {

      setTimeout(() => {
      for (let i = 0; i <= 50; i++) {
      setTimeout(() => {
        
        results.style.opacity = i * 0.05;        
      }, 30 * i);
      }
      }, 20);
     }

    
    
    
      function muteAudio() {
        
        roomtone.pause();
      if(mute == false) mute = true;
      else if(mute == true) mute = false;
  
  
  
  }
    
    
    
    
    function oddOrEven(x) {
  return ( x & 1 ) ? "odd" : "even";
}
    
    
    function tryAgain() {
      console.log("pressed");
      
    hb = getRandomIntInclusive(40, 140);
    sys = getRandomIntInclusive(80, 240);
    
    
    dia = sys - getRandomIntInclusive(30, 50);
    
    
    
    if(oddOrEven(sys) == "odd")
      sys += 1;
    
    if(oddOrEven(dia) == "odd")
      dia += 1;
      
      console.log(sys + " " + dia + " " + hb + " ");
                       document.getElementById("results").style.opacity = "0";
          document.getElementById("hb").textContent = hb;
      document.getElementById("sys").textContent = sys;
            document.getElementById("dia").textContent = dia;
      
      
      document.getElementById('diaInput').value = '';
      
      document.getElementById('sysInput').value = '';
    document.getElementById("tryAgain").style.display = "none";
                        tryAgain.disabled = true;


      
    }
    
    
  </script>
  
</body>
</html>
